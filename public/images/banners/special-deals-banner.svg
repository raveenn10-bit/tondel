<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-special-deals-banner.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240816"/>
      <stop offset="100%" stop-color="#47142D"/>
    </linearGradient>
    <radialGradient id="glow-special-deals-banner.svg" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg-special-deals-banner.svg)"/>
  <rect width="1200" height="480" rx="24" fill="url(#glow-special-deals-banner.svg)"/>
  <rect x="2" y="2" width="1196" height="476" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Subtle decorative graphic lines -->
  <g opacity="0.15">
    <circle cx="950" cy="240" r="180" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="950" cy="240" r="120" fill="none" stroke="#F43F5E" stroke-width="3"/>
    <circle cx="950" cy="240" r="60" fill="#F43F5E" fill-opacity="0.2"/>
  </g>
  
  <!-- Content -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#F43F5E" fill-opacity="0.18" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#F43F5E" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">SPECIAL OFFERS & BUNDLES</text>
    
    <!-- Title -->
    <text x="0" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">LIMITED TIME TECH SPECIALS</text>
    
    <!-- Subtitle -->
    <text x="0" y="140" fill="#CBD5E1" font-family="system-ui, sans-serif" font-weight="400" font-size="18" max-width="700">Save Big on Smartphones, Earbuds & GaN Chargers. Guaranteed Authentic Warranties.</text>
    
    <!-- Button CTA mockup -->
    <g transform="translate(0, 185)">
      <rect width="210" height="52" rx="26" fill="#F43F5E"/>
      <text x="105" y="32" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="16">View Special Offers →</text>
    </g>
  </g>
  
  <!-- Watermark -->
  <text x="1120" y="440" text-anchor="end" fill="#FFFFFF" fill-opacity="0.2" font-family="system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="3">TONDEL.LK</text>
</svg>