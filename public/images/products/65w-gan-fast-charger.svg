<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-65w-gan-fast-charger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="radial-65w-gan-fast-charger" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00A6DA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00A6DA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#bg-65w-gan-fast-charger)"/>
  <rect width="600" height="600" rx="30" fill="url(#radial-65w-gan-fast-charger)"/>
  <rect x="2" y="2" width="596" height="596" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle tech background grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>
  
  <!-- Brand & Category Tag -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#00A6DA" fill-opacity="0.15" stroke="#00A6DA" stroke-width="1.2"/>
  <text x="105" y="58" text-anchor="middle" fill="#00A6DA" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">ANKER</text>
  
  <!-- Genuine Verification Stamp -->
  <g transform="translate(430, 40)">
    <rect width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="65" y="18" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.5">✓ 100% GENUINE</text>
  </g>

  <!-- Product Illustration -->
  <g transform="translate(0, 20)">
    
        <!-- Charger Body -->
        <rect x="220" y="140" width="160" height="200" rx="24" fill="#0F172A" stroke="#00A6DA" stroke-width="4"/>
        <!-- Wall Prongs -->
        <rect x="250" y="80" width="22" height="60" rx="6" fill="#94A3B8"/>
        <rect x="328" y="80" width="22" height="60" rx="6" fill="#94A3B8"/>
        <!-- Ports plate -->
        <rect x="245" y="220" width="110" height="90" rx="14" fill="#1E293B"/>
        <!-- Type-C 1 -->
        <rect x="270" y="235" width="60" height="14" rx="7" fill="#0F172A" stroke="#00A6DA" stroke-width="2"/>
        <text x="300" y="246" text-anchor="middle" fill="#00A6DA" font-size="8" font-weight="bold">Type-C 65W</text>
        <!-- Type-C 2 -->
        <rect x="270" y="260" width="60" height="14" rx="7" fill="#0F172A" stroke="#00A6DA" stroke-width="2"/>
        <!-- USB-A -->
        <rect x="270" y="285" width="60" height="14" rx="4" fill="#0F172A" stroke="#EAB308" stroke-width="2"/>
        <text x="300" y="195" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="28">65W</text>
        <text x="300" y="212" text-anchor="middle" fill="#00A6DA" font-family="sans-serif" font-weight="700" font-size="11">GaN Fast Tech</text>
      
  </g>
  
  <!-- Bottom Product Title and Watermark -->
  <rect x="40" y="505" width="520" height="60" rx="16" fill="#0B132B" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="65" y="541" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18">65W GaN Dual-Port Fast Charger Adapter</text>
  <text x="535" y="541" text-anchor="end" fill="#00A6DA" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">TONDEL.LK</text>
</svg>