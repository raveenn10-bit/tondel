<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-braided-type-c-cable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="radial-braided-type-c-cable" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#bg-braided-type-c-cable)"/>
  <rect width="600" height="600" rx="30" fill="url(#radial-braided-type-c-cable)"/>
  <rect x="2" y="2" width="596" height="596" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle tech background grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>
  
  <!-- Brand & Category Tag -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#EAB308" fill-opacity="0.15" stroke="#EAB308" stroke-width="1.2"/>
  <text x="105" y="58" text-anchor="middle" fill="#EAB308" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">BASEUS</text>
  
  <!-- Genuine Verification Stamp -->
  <g transform="translate(430, 40)">
    <rect width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="65" y="18" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.5">✓ 100% GENUINE</text>
  </g>

  <!-- Product Illustration -->
  <g transform="translate(0, 20)">
    
        <!-- Cable Loop -->
        <path d="M180 280 C180 140, 420 140, 420 280 C420 380, 180 380, 180 280" fill="none" stroke="#EAB308" stroke-width="12" stroke-dasharray="8 6"/>
        <!-- Connector 1 -->
        <g transform="translate(140, 240) rotate(-20)">
          <rect x="0" y="0" width="70" height="34" rx="10" fill="#0F172A" stroke="#EAB308" stroke-width="3"/>
          <rect x="65" y="6" width="30" height="22" rx="4" fill="#94A3B8"/>
          <text x="35" y="22" text-anchor="middle" fill="#EAB308" font-family="sans-serif" font-weight="bold" font-size="10">100W</text>
        </g>
        <!-- Connector 2 -->
        <g transform="translate(390, 260) rotate(25)">
          <rect x="0" y="0" width="70" height="34" rx="10" fill="#0F172A" stroke="#EAB308" stroke-width="3"/>
          <rect x="65" y="6" width="30" height="22" rx="4" fill="#94A3B8"/>
        </g>
      
  </g>
  
  <!-- Bottom Product Title and Watermark -->
  <rect x="40" y="505" width="520" height="60" rx="16" fill="#0B132B" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="65" y="541" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18">Braided Type-C to Type-C 100W Fast Cable</text>
  <text x="535" y="541" text-anchor="end" fill="#EAB308" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">TONDEL.LK</text>
</svg>