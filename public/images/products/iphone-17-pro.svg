<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-iphone-17-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="radial-iphone-17-pro" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#bg-iphone-17-pro)"/>
  <rect width="600" height="600" rx="30" fill="url(#radial-iphone-17-pro)"/>
  <rect x="2" y="2" width="596" height="596" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle tech background grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>
  
  <!-- Brand & Category Tag -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1.2"/>
  <text x="105" y="58" text-anchor="middle" fill="#6366F1" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">APPLE</text>
  
  <!-- Genuine Verification Stamp -->
  <g transform="translate(430, 40)">
    <rect width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="65" y="18" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.5">✓ 100% GENUINE</text>
  </g>

  <!-- Product Illustration -->
  <g transform="translate(0, 20)">
    
        <!-- Futuristic Ultra-Slim Bezel Phone -->
        <rect x="210" y="70" width="180" height="350" rx="36" fill="#090E17" stroke="#6366F1" stroke-width="4"/>
        <rect x="216" y="76" width="168" height="338" rx="30" fill="#131F37"/>
        <!-- Dynamic Island -->
        <rect x="270" y="90" width="60" height="18" rx="9" fill="#000000" stroke="#6366F1" stroke-width="1.5"/>
        <circle cx="282" cy="99" r="4" fill="#1E293B"/>
        <!-- Hologram screen lines -->
        <line x1="240" y1="170" x2="360" y2="170" stroke="#6366F1" stroke-opacity="0.5" stroke-width="2"/>
        <line x1="240" y1="210" x2="330" y2="210" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2"/>
        <circle cx="300" cy="270" r="38" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="300" y="275" text-anchor="middle" fill="#6366F1" font-family="sans-serif" font-weight="700" font-size="13">TITANIUM</text>
      
  </g>
  
  <!-- Bottom Product Title and Watermark -->
  <rect x="40" y="505" width="520" height="60" rx="16" fill="#0B132B" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="65" y="541" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18">Apple iPhone 17 Pro</text>
  <text x="535" y="541" text-anchor="end" fill="#6366F1" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">TONDEL.LK</text>
</svg>