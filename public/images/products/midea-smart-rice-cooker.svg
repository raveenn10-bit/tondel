<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-midea-smart-rice-cooker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="radial-midea-smart-rice-cooker" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0091FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0091FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#bg-midea-smart-rice-cooker)"/>
  <rect width="600" height="600" rx="30" fill="url(#radial-midea-smart-rice-cooker)"/>
  <rect x="2" y="2" width="596" height="596" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle tech background grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>
  
  <!-- Brand & Category Tag -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#0091FF" fill-opacity="0.15" stroke="#0091FF" stroke-width="1.2"/>
  <text x="105" y="58" text-anchor="middle" fill="#0091FF" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">MIDEA</text>
  
  <!-- Genuine Verification Stamp -->
  <g transform="translate(430, 40)">
    <rect width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="65" y="18" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.5">✓ 100% GENUINE</text>
  </g>

  <!-- Product Illustration -->
  <g transform="translate(0, 20)">
    
        <!-- Cooker Body -->
        <path d="M180 200 C180 160, 420 160, 420 200 L420 330 C420 370, 180 370, 180 330 Z" fill="#0F172A" stroke="#0091FF" stroke-width="4"/>
        <!-- Lid Handle -->
        <rect x="250" y="130" width="100" height="32" rx="16" fill="#1E293B" stroke="#0091FF" stroke-width="3"/>
        <!-- Digital Display Panel -->
        <rect x="235" y="225" width="130" height="75" rx="12" fill="#090E17" stroke="#0091FF" stroke-width="2"/>
        <text x="300" y="258" text-anchor="middle" fill="#0091FF" font-family="monospace" font-weight="bold" font-size="22">00:25</text>
        <circle cx="260" cy="282" r="5" fill="#10B981"/>
        <text x="272" y="286" fill="#94A3B8" font-family="sans-serif" font-size="9">WARM</text>
        <circle cx="320" cy="282" r="5" fill="#EF4444"/>
        <text x="332" y="286" fill="#94A3B8" font-family="sans-serif" font-size="9">COOK</text>
        <!-- Base Rim -->
        <rect x="195" y="345" width="210" height="15" rx="7" fill="#1E293B"/>
      
  </g>
  
  <!-- Bottom Product Title and Watermark -->
  <rect x="40" y="505" width="520" height="60" rx="16" fill="#0B132B" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="65" y="541" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18">Midea 1.8L Smart Digital Fuzzy Logic Rice Cooker</text>
  <text x="535" y="541" text-anchor="end" fill="#0091FF" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">TONDEL.LK</text>
</svg>