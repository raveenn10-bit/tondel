<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-midea-electric-kettle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15213F"/>
    </linearGradient>
    <radialGradient id="radial-midea-electric-kettle" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="30" fill="url(#bg-midea-electric-kettle)"/>
  <rect width="600" height="600" rx="30" fill="url(#radial-midea-electric-kettle)"/>
  <rect x="2" y="2" width="596" height="596" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Subtle tech background grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
  </g>
  
  <!-- Brand & Category Tag -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="105" y="58" text-anchor="middle" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">MIDEA</text>
  
  <!-- Genuine Verification Stamp -->
  <g transform="translate(430, 40)">
    <rect width="130" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="65" y="18" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.5">✓ 100% GENUINE</text>
  </g>

  <!-- Product Illustration -->
  <g transform="translate(0, 20)">
    
        <!-- Kettle Base -->
        <ellipse cx="300" cy="370" rx="100" ry="18" fill="#1E293B" stroke="#06B6D4" stroke-width="3"/>
        <!-- Kettle Body -->
        <path d="M225 360 L245 180 C245 160, 355 160, 355 180 L375 360 Z" fill="#0F172A" stroke="#06B6D4" stroke-width="4"/>
        <!-- Spout -->
        <path d="M245 185 L200 175 L228 230 Z" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
        <!-- Handle -->
        <path d="M360 190 C420 190, 420 330, 370 330" fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round"/>
        <!-- Lid & Knob -->
        <rect x="270" y="145" width="60" height="20" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="3"/>
        <circle cx="300" cy="140" r="8" fill="#06B6D4"/>
        <!-- Water Level Indicator Window -->
        <rect x="290" y="230" width="20" height="80" rx="10" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="2"/>
        <line x1="290" y1="270" x2="310" y2="270" stroke="#06B6D4" stroke-width="2"/>
      
  </g>
  
  <!-- Bottom Product Title and Watermark -->
  <rect x="40" y="505" width="520" height="60" rx="16" fill="#0B132B" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="65" y="541" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18">Midea 1.7L Double-Wall Stainless Steel Electric Kettle</text>
  <text x="535" y="541" text-anchor="end" fill="#06B6D4" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="1">TONDEL.LK</text>
</svg>